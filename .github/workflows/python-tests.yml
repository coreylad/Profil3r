name: Python tests
on:
  push:
    branches: [main, develop/modernization-overhaul]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Compile
        run: python -m compileall -q profil3r
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Installed package import smoke test
        run: |
          cd /tmp
          python -c "import profil3r.modules.email.email; import profil3r.modules.social.facebook; import profil3r.modules.porn.onlyfans; import profil3r.suite"
      - name: CLI help smoke test
        run: |
          profil3r suite --help
          profil3r --help
